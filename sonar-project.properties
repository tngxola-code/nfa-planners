sonar.projectKey=tngxola-code_nfa-planners
sonar.organization=tngxola-code

# Source directories
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.spec.ts,**/__tests__/**,**/migrations/**,**/prisma/**

# TypeScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# ESLint report (optional, if you want to import issues)
sonar.eslint.reportPaths=eslint-report.json

# Encoding
sonar.sourceEncoding=UTF-8
